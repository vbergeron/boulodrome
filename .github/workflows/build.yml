name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-compiler: ["5.2"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - id: week
        run: echo "value=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # setup-ocaml caches the bare compiler switch but deliberately not opam
      # dependencies (coq-lsp pulls in rocq-runtime/rocq-core, which compile
      # from source and dominate build time). Cache `_opam` ourselves,
      # rotating weekly so the opam-repository snapshot can't go stale forever.
      - uses: actions/cache@v4
        with:
          path: _opam
          key: opam-deps-${{ runner.os }}-${{ matrix.ocaml-compiler }}-${{ hashFiles('*.opam') }}-${{ steps.week.outputs.value }}

      - run: opam install . --deps-only --with-test

      - run: opam exec -- dune build

      - run: opam exec -- dune test
