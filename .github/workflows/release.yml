name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - run: opam install . --deps-only

      - run: opam exec -- dune build

      - name: Install release tools
        run: opam install dune-release.2.2.1 opam-publish.3.0.1

      - name: Create distribution and GitHub release
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          opam exec -- dune-release distrib
          opam exec -- dune-release publish --yes
        env:
          DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.DUNE_RELEASE_GITHUB_TOKEN }}

      - name: Submit to opam-repository
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGES.md > "$RUNNER_TEMP/release-notes.md"
          opam exec -- opam publish --no-confirmation --no-browser --msg-file="$RUNNER_TEMP/release-notes.md" --tag="${GITHUB_REF_NAME}"
        env:
          OPAM_PUBLISH_GH_TOKEN: ${{ secrets.DUNE_RELEASE_GITHUB_TOKEN }}
