name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          opam-repositories: |
            default: https://github.com/ocaml/opam-repository.git
            coq-released: https://coq.inria.fr/opam/released

      - run: opam install . --deps-only

      - run: opam exec -- dune build

      - name: Install dune-release
        run: opam install dune-release

      - name: Publish to opam-repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          opam exec -- dune-release distrib
          opam exec -- dune-release publish --yes
          opam exec -- dune-release opam submit --yes
        env:
          DUNE_RELEASE_GITHUB_TOKEN: ${{ secrets.DUNE_RELEASE_GITHUB_TOKEN }}
